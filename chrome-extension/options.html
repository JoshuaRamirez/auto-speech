<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Speak Selection — Options</title>
    <style>
      body {
        font: 14px/1.5 -apple-system, system-ui, sans-serif;
        max-width: 480px;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #1a1a1a;
      }
      h1 { font-size: 1.2rem; }
      h2 { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.04em;
           color: #888; margin: 1.8rem 0 0; }
      label { display: block; margin: 1.1rem 0 0.3rem; font-weight: 600; }
      select, input[type="range"], input[type="text"] { width: 100%; }
      input[type="text"] { padding: 0.35rem; box-sizing: border-box; }
      .val { font-weight: 400; color: #666; }
      .hint { font-size: 0.85rem; color: #888; margin-top: 0.3rem; }
      .hidden { display: none; }
      button {
        margin-top: 1.5rem;
        padding: 0.5rem 1rem;
        font-size: 14px;
        cursor: pointer;
      }
      #status { margin-left: 0.75rem; }
      #status.ok { color: #0a7a0a; }
      #status.err { color: #c0392b; }
      @media (prefers-color-scheme: dark) {
        body { background: #1a1a1a; color: #eee; }
        .val, .hint { color: #aaa; }
        input[type="text"] { background: #2a2a2a; color: #eee; border: 1px solid #444; }
      }
    </style>
  </head>
  <body>
    <h1>Speak Selection</h1>

    <label for="backend">Voice engine</label>
    <select id="backend">
      <option value="local">Local auto-speech (Kokoro) — best quality</option>
      <option value="browser">Browser built-in voices</option>
    </select>

    <!-- Local backend -->
    <section id="local-section">
      <h2>Local server</h2>
      <label for="serverUrl">Server URL</label>
      <input id="serverUrl" type="text" placeholder="http://127.0.0.1:7860" />
      <div class="hint">
        Start it with <code>/auto-speech-app</code> or
        <code>python plugin/scripts/python/web_server.py</code>.
        <span id="server-check"></span>
      </div>

      <label for="voiceId">Voice id <span class="val">(blank = server default)</span></label>
      <input id="voiceId" type="text" placeholder="af_heart" />

      <label for="speed">Speed <span class="val" id="speed-val"></span></label>
      <input id="speed" type="range" min="0.5" max="2" step="0.1" />
    </section>

    <!-- Browser backend -->
    <section id="browser-section" class="hidden">
      <h2>Browser voice</h2>
      <label for="voice">Voice</label>
      <select id="voice"></select>

      <label for="rate">Rate <span class="val" id="rate-val"></span></label>
      <input id="rate" type="range" min="0.5" max="2" step="0.1" />

      <label for="pitch">Pitch <span class="val" id="pitch-val"></span></label>
      <input id="pitch" type="range" min="0" max="2" step="0.1" />

      <label for="volume">Volume <span class="val" id="volume-val"></span></label>
      <input id="volume" type="range" min="0" max="1" step="0.1" />
    </section>

    <div>
      <button id="test">Test voice</button>
      <button id="save">Save</button>
      <span id="status"></span>
    </div>

    <script src="options.js"></script>
  </body>
</html>
