<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Speak Selection — Options</title>
    <style>
      body {
        font: 14px/1.5 -apple-system, system-ui, sans-serif;
        max-width: 480px;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #1a1a1a;
      }
      h1 { font-size: 1.2rem; }
      label { display: block; margin: 1.1rem 0 0.3rem; font-weight: 600; }
      select, input[type="range"] { width: 100%; }
      .val { font-weight: 400; color: #666; }
      button {
        margin-top: 1.5rem;
        padding: 0.5rem 1rem;
        font-size: 14px;
        cursor: pointer;
      }
      #status { margin-left: 0.75rem; color: #0a7a0a; }
      @media (prefers-color-scheme: dark) {
        body { background: #1a1a1a; color: #eee; }
        .val { color: #aaa; }
      }
    </style>
  </head>
  <body>
    <h1>Speak Selection</h1>

    <label for="voice">Voice</label>
    <select id="voice"></select>

    <label for="rate">Rate <span class="val" id="rate-val"></span></label>
    <input id="rate" type="range" min="0.5" max="2" step="0.1" />

    <label for="pitch">Pitch <span class="val" id="pitch-val"></span></label>
    <input id="pitch" type="range" min="0" max="2" step="0.1" />

    <label for="volume">Volume <span class="val" id="volume-val"></span></label>
    <input id="volume" type="range" min="0" max="1" step="0.1" />

    <div>
      <button id="test">Test voice</button>
      <button id="save">Save</button>
      <span id="status"></span>
    </div>

    <script src="options.js"></script>
  </body>
</html>
